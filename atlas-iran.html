#q{border:1.5px solid #1d355755;border-radius:99px;padding:4px 14px;width:180px;font-size:14px}
#res{position:absolute;top:100%;background:#fff;border-radius:10px;box-shadow:0 4px 14px #0003;min-width:220px;overflow:hidden}#res div{padding:6px 14px;cursor:pointer;font-size:14px}#res div:hover{background:#e8f6ee}#res small{opacity:.55;margin-inline-start:8px}
#panel{position:absolute;right:12px;z-index:4;top:70px;inset-inline-start:12px;width:316px;max-height:calc(100% - 86px);overflow:auto;background:#fffdf8;border-radius:16px;padding:16px;box-shadow:0 6px 24px #0004;line-height:1.7}
#panel h2{margin:0;font-size:24px;font-weight:800}#panel h3{margin:14px 0 4px;font-size:14px;color:#0b7a4b;border-bottom:2px solid #0b7a4b33}
.r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #1d355726;font-size:14px}.r b{font-weight:600;text-align:left}
.big{width:100%;margin-top:12px;background:#0b7a4b;color:#fff;border:0;border-radius:10px;padding:8px;cursor:pointer;font-weight:600}
select{width:100%;margin:4px 0;padding:6px;border-radius:8px;border:1.5px solid #1d355755;background:#fff}
.note{font-size:12px;opacity:.7;margin-top:8px}.res{font-size:15px;margin-top:8px}
#zm{position:absolute;left:12px;bottom:14px;z-index:4;display:flex;flex-direction:column;gap:6px}#zm button{width:38px;height:38px;border-radius:10px;border:0;background:#fffdf8;font-size:20px;cursor:pointer;box-shadow:0 2px 8px #0003}
#tip{position:fixed;z-index:9;pointer-events:none;background:#1d3557;color:#fff;border-radius:8px;padding:2px 10px;font-size:13px;display:none}
.nb{fill:#efe9dc;fill-opacity:.8;stroke:#a89f8a;stroke-width:.8;vector-effect:non-scaling-stroke}
#pG path{stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;fill-opacity:.6}#pG path:hover{fill-opacity:.85}#pG path.sel{stroke:#1d3557;stroke-width:2.4}
.nat #pG path{fill-opacity:0;stroke:#5b3a1e;stroke-dasharray:5 3;stroke-width:1.1}.nat #pG path:hover{fill-opacity:.15}.nat .nb{fill-opacity:0}.pol #rl{opacity:.5}
.lk{fill:#a9d4e8;stroke:#6fb0cf;stroke-width:.7;vector-effect:non-scaling-stroke;pointer-events:none}.rv{fill:none;stroke:#4f9cc8;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.rd{fill:none;stroke:#c0392b;stroke-width:1.6;stroke-opacity:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.rt{fill:none;stroke:#d9502b;stroke-width:3.5;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;pointer-events:none}
.l text{font-size:12px;font-weight:600;fill:#1d3557;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-opacity:.85;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.l.pr text{font-size:14px;font-weight:800;fill:#0b5e3a;stroke-opacity:.7}.l.c text{fill:#8a7f68;font-size:13px}
.l.t text,.l.k text{text-anchor:start;font-size:11.5px;font-weight:500}.l.t,.l.k{cursor:pointer}.l.t circle{fill:#fff;stroke:#1d3557;stroke-width:1.5}.l.t.pc circle{fill:#0b7a4b}.l.t.cap circle{fill:#d9502b}
.l.m text,.l.r text,.l.l text{fill:#1f6f9c;font-style:italic}.l.p text{fill:#6d3f14;font-size:12px}.l.k path{fill:#8b5a2b;stroke:#fff;stroke-width:1}.l.k text{fill:#6b4423;font-size:11px}

fl.addEventListener('click',e=>{const h=fhit(e);if(h.l&&h.l.ty==='t')pickCity(h.l.c);else if(h.p)pickP(h.p)});
function view(){const m=innerWidth<=760,pb=m&&sel?$('#panel').offsetHeight:0;return{pw:m?0:340,pb}}
const HR=()=>innerWidth<=760?16:9;
function zoomPx([[x0,y0],[x1,y1]],kmax=KMAX){
 const v=view(),aw=W-v.pw,ah=H-HT-v.pb,kk=Math.max(1,Math.min(kmax,.72*Math.min((aw-20)/(x1-x0||1),(ah-20)/(y1-y0||1)))),cx=(x0+x1)/2,cy=(y0+y1)/2;
 svg.transition().duration(900).call(zoom.transform,d3.zoomIdentity.translate(aw/2-cx*kk,HT+ah/2-cy*kk).scale(kk));
}
function mainBounds(f){const g=f.geometry;if(g.type==='Polygon')return path.bounds(f);let best,ba=-1;
 for(const c of g.coordinates){const pf={type:'Polygon',coordinates:c},a=d3.geoArea(pf);if(a>ba){ba=a;best=pf}}return path.bounds(best)}
function mark(){sched()}
function pickP(f){sel={p:f};mark();clearRoute();panel();zoomPx(mainBounds(f))}
function pickCity(c){sel={c};mark();panel();const[x,y]=proj([c.x,c.y]);zoomPx([[x-40,y-25],[x+40,y+25]],10)}
function clearRoute(){ROUTE=null;sched()}
function panel0(){
 const el=$('#panel');
 if(!sel){el.innerHTML=`<h2>اطلس ایران</h2><p>روی یک <b>استان</b> یا <b>شهر</b> کلیک کن. با دکمه‌ی «طبیعی» کوه‌ها و دشت‌ها را ببین و با «فاصله‌ی شهرها» فاصله‌ی دو شهر را حساب کن.</p><button class="big" id="rnd">🎲 یک استان شانسی!</button>`;$('#rnd').onclick=()=>pickP(D.prov.features[Math.floor(Math.random()*31)]);return}
 if(sel.p){const p=sel.p.properties,cs=C.filter(c=>c.pi===p.i),cap=C[p.ci],area=d3.geoArea(sel.p)*6371**2;
  el.innerHTML=`<h2>استان ${p.n}</h2><small dir="ltr">${p.en}</small>`+row('مرکز استان',cap?cap.n:'—')+row('مساحت تقریبی',fa(area)+' کیلومتر مربع')+row('شهرهای ثبت‌شده',fa(cs.length))
   +'<h3>شهرهای بزرگ</h3>'+cs.filter(c=>c.p>0).slice(0,6).map(c=>row(c.n,pop(c.p))).join('');return}
 if(sel.c){const c=sel.c,pv=D.prov.features[c.pi],th=C.find(x=>x.e==='Tehran');
  el.innerHTML=`<h2>${c.n}</h2><small dir="ltr">${c.e}</small>`+row('استان',pv?pv.properties.n:'—')+row('نقش',c.cap?'پایتخت':c.pc?'مرکز استان':'شهر')+row('جمعیت',pop(c.p))+(c===th?'':row('فاصله‌ی هوایی تا تهران',fa(KM(c,th))+' کیلومتر'))
   +`<button class="big" id="go">📏 فاصله تا شهر دیگر</button>`;$('#go').onclick=()=>dpanel(c);return}
}
function closeBtn(el){el.insertAdjacentHTML('afterbegin','<button class="x" id="px">✕</button>');$('#px').onclick=()=>{sel=null;clearRoute();panel();sched()}}
function panel(){panel0();const el=$('#panel');el.classList.toggle('empty',!sel);if(sel)closeBtn(el)}
const opts=()=>C.slice().sort((a,b)=>a.n.localeCompare(b.n,'fa')).map(c=>`<option value="${C.indexOf(c)}">${c.n}</option>`).join('');
function dpanel(a,b){
 const el=$('#panel');sel=null;mark();el.classList.remove('empty');
 el.innerHTML=`<h2>فاصله‌ی دو شهر</h2><label>از</label><select id="sa">${opts()}</select><label>تا</label><select id="sb"><option value="">یک شهر انتخاب کن…</option>${opts()}</select><div id="out"></div>`;
 closeBtn(el);$('#sa').value=a?C.indexOf(a):C.findIndex(c=>c.e==='Tehran');if(b)$('#sb').value=C.indexOf(b);
 const go=()=>calc(C[+$('#sa').value],$('#sb').value===''?null:C[+$('#sb').value]);$('#sa').onchange=go;$('#sb').onchange=go;go();
}
function calc(a,b){
 clearRoute();const o=$('#out');if(!b||a===b){o.innerHTML='';return}
 const air=KM(a,b),A=C.indexOf(a),B=C.indexOf(b),dist=C.map(()=>1e9),prev=[],q=[A];dist[A]=0;
 while(q.length){q.sort((x,y)=>dist[x]-dist[y]);const u=q.shift();for(const[v,w]of ADJ[u])if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;q.push(v)}}
 const ok=dist[B]<1e9,road=ok?dist[B]:air*1.25;let pts=[[a.x,a.y],[b.x,b.y]],names='';
 if(ok){pts=[];names=[];for(let v=B;v!=null;v=prev[v]){pts.unshift([C[v].x,C[v].y]);names.unshift(C[v].n)}names='<div class="note">مسیر: '+names.join(' ← ')+'</div>'}
 ROUTE=new Path2D(path({type:'LineString',coordinates:pts}));sched();
 o.innerHTML=`<div class="res">${row('فاصله‌ی هوایی',fa(air)+' کیلومتر')}${row('فاصله‌ی جاده‌ای (تقریبی)',fa(road)+' کیلومتر')}${row('زمان تقریبی با ۸۰ کیلومتر در ساعت',fa(road/80,1)+' ساعت')}</div>${names}<div class="note">فاصله‌ی هوایی دقیق است. فاصله‌ی جاده‌ای از روی یک شبکه‌ی ساده‌شده‌ی راه‌های اصلی برآورد شده و با فاصله‌ی واقعی تفاوت دارد.</div>`;
 const[x0,y0]=proj([Math.min(a.x,b.x),Math.max(a.y,b.y)]),[x1,y1]=proj([Math.max(a.x,b.x),Math.min(a.y,b.y)]);zoomPx([[x0,y0],[x1,y1]],6);
}
$('#md').onclick=e=>{const v=e.target.dataset.v;if(!v)return;mode=v;sched();[...$('#md').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v))};
document.querySelectorAll('[data-l]').forEach(i=>i.onchange=()=>{layers[i.dataset.l]=i.checked?1:0;update()});
$('#dist').onclick=()=>dpanel();
$('#zi').onclick=()=>svg.transition().call(zoom.scaleBy,1.6);$('#zo').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.6);
$('#zr').onclick=()=>{sel=null;mark();clearRoute();panel();svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity)};
$('#q').oninput=e=>{const q=norm(e.target.value.trim()),r=$('#res');if(!q){r.innerHTML='';return}
 const hits=[...D.prov.features.filter(f=>norm(f.properties.n).includes(q)||f.properties.en.toLowerCase().includes(q)).map(f=>({t:'استان '+f.properties.n,s:'استان',f})),
  ...C.filter(c=>norm(c.n).includes(q)||c.e.toLowerCase().includes(q)).map(c=>({t:c.n,s:'شهر',c}))].slice(0,8);
 r.innerHTML='';hits.forEach(h=>{const d=document.createElement('div');d.innerHTML=`${h.t}<small>${h.s}</small>`;d.onclick=()=>{r.innerHTML='';e.target.value='';h.f?pickP(h.f):pickCity(h.c)};r.appendChild(d)})};
$('#gear').onclick=()=>{$('header').classList.toggle('open');HT=$('header').offsetHeight;sched()};
addEventListener('resize',render);render();panel();
</script></body></html>
